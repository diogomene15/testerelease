name: Guard · release → main

# `main` só recebe código que já passou pela homologação em `release` — ou uma
# correção urgente vinda de `hotfix/*`, que é justamente o caminho que pula a
# homologação. Nenhuma outra origem é aceita.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-main-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    # Os Release PRs abertos pelo próprio release-please têm esta mesma base;
    # eles não vêm de `develop`/`release` e não devem passar pelo guard.
    if: ${{ !startsWith(github.event.pull_request.head.ref, 'release-please--') }}
    name: Origem e versão a promover
    runs-on: ubuntu-latest
    steps:
      - name: Exigir que a origem seja release ou hotfix
        if: ${{ github.event.pull_request.head.ref != 'release' && !startsWith(github.event.pull_request.head.ref, 'hotfix/') }}
        run: |
          echo "::error::Só 'release' (promoção) ou 'hotfix/*' (correção urgente) podem abrir PR para 'main'. Origem recebida: '${{ github.event.pull_request.head.ref }}'."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Comentar versão que será promovida
        uses: actions/github-script@v7
        with:
          script: |
            const { execFileSync } = require('child_process');
            const { parseConventional, highestImpact } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/validate-pr.js`);
            const { bumpStable, stableCore, nextHotfix, nextRcForHotfix } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/compute-version.js`);
            const { isHotfixBranch } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/hotfix.js`);

            const pr = context.payload.pull_request;
            const isHotfix = isHotfixBranch(pr.head.ref);

            const readManifest = (ref, file) => {
              try {
                return JSON.parse(execFileSync('git', ['show', `origin/${ref}:${file}`], { encoding: 'utf8' }))['.'];
              } catch {
                return null;
              }
            };

            const lastStable = readManifest(pr.base.ref, '.release-please-manifest.json') || '0.0.0';
            const currentRc = readManifest(pr.head.ref, '.release-please-manifest-rc.json') || '0.0.0';

            const rawCommits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: pr.number, per_page: 100,
            });

            const parsed = rawCommits
              .map((c) => parseConventional(c.commit.message, ''))
              .filter((p) => p.valid);

            const impact = highestImpact(parsed);

            // O hotfix não passa pela homologação: a versão não vem do impacto
            // dos commits, e sim da estável que está em produção agora.
            const projected = isHotfix ? nextHotfix(lastStable) : bumpStable(lastStable, impact);

            const IMPACT_LABEL = {
              major: '`MAJOR` — quebra de compatibilidade',
              minor: '`MINOR` — nova funcionalidade',
              patch: '`PATCH` — correção',
              none: 'nenhum bump (só manutenção)',
            };

            const lines = [
              '<!-- pr-main-guard -->',
              isHotfix ? '## 🚑 Hotfix em produção' : '## 🚀 Promoção para produção',
              '',
              '| | |',
              '| --- | --- |',
              `| Origem | \`${pr.head.ref}\` ${isHotfix ? '(correção urgente)' : '(staging)'} |`,
            ];

            if (!isHotfix) {
              lines.push(`| RC homologada | \`${currentRc === '0.0.0' ? '—' : 'v' + currentRc}\` |`);
            }

            lines.push(
              `| Em produção hoje | \`${lastStable === '0.0.0' ? '—' : 'v' + lastStable}\` |`,
              `| Impacto dos commits | ${IMPACT_LABEL[impact]}${isHotfix ? ' (não altera o núcleo)' : ''} |`,
              `| **Versão a publicar** | **\`v${projected}\`** |`,
              ''
            );

            if (isHotfix) {
              const rcHoje = readManifest('release', '.release-please-manifest-rc.json');
              const rcDepois = rcHoje ? nextRcForHotfix(rcHoje) : null;

              lines.push(
                'O núcleo `' + stableCore(lastStable) + '` é preservado: o hotfix é publicado **sobre** a',
                'estável que já está em produção, com o sufixo `-hf`. Hotfixes seguintes sobre a mesma',
                'estável avançam o contador (`-hf.2`, `-hf.3`, …).',
                '',
                '### Back-merges obrigatórios depois deste PR',
                '',
                '| PR | Merge | Versão resultante |',
                '| --- | --- | --- |',
                `| \`${pr.head.ref}\` → \`release\` | merge commit | ${rcDepois ? `\`v${rcHoje}\` → **\`v${rcDepois}\`**` : 'PATCH no núcleo da RC'} |`,
                `| \`${pr.head.ref}\` → \`develop\` | squash | nenhuma — título \`chore(hotfix): …\` |`,
                '',
                'Sem eles a correção volta a sumir no próximo ciclo. Detalhes em [`docs/HOTFIX.md`](../blob/main/docs/HOTFIX.md).',
                ''
              );
            } else if (currentRc !== '0.0.0' && stableCore(currentRc) !== projected) {
              lines.push(
                `> ⚠️ A RC homologada (\`v${currentRc}\`) aponta para \`v${stableCore(currentRc)}\`, `,
                `> mas a promoção calculou \`v${projected}\`. Confira se \`release\` está em dia com \`main\`.`,
                ''
              );
            }

            lines.push(
              'Ao mergear (**merge commit**), o workflow `Release Estável` publica a tag `v' + projected + '`,',
              'atualiza o `CHANGELOG.md` e cria a release no GitHub com as release notes.'
            );

            const body = lines.join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: pr.number, per_page: 100,
            });
            const previous = comments.find((c) => c.body?.includes('<!-- pr-main-guard -->'));

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: previous.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: pr.number, body,
              });
            }

            await core.summary.addRaw(body.replace('<!-- pr-main-guard -->', '')).write();
