name: Preview · develop → release

# Quando abre um PR de `develop` para `release`, o release-please entra em ação
# em modo dry-run e calcula qual release candidate sairá do merge. O resultado
# vira um comentário no PR e um status check.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [release]

permissions:
  # `write` porque o preview publica (e remove) a branch efêmera com o merge
  # simulado. PRs vindos de fork recebem token somente-leitura de qualquer forma.
  contents: write
  pull-requests: write

concurrency:
  group: pr-release-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Os Release PRs abertos pelo próprio release-please têm esta mesma base;
    # eles não vêm de `develop`/`release` e não devem passar pelo guard.
    if: ${{ !startsWith(github.event.pull_request.head.ref, 'release-please--') }}
    name: release-please · cálculo da versão RC
    runs-on: ubuntu-latest
    steps:
      - name: Exigir que a origem seja develop ou hotfix
        if: ${{ github.event.pull_request.head.ref != 'develop' && !startsWith(github.event.pull_request.head.ref, 'hotfix/') }}
        run: |
          echo "::error::Só 'develop' (ciclo normal) ou 'hotfix/*' (retroporte) podem abrir PR para 'release'. Origem recebida: '${{ github.event.pull_request.head.ref }}'."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Um retroporte de hotfix não é versionado pelos commits: o núcleo da RC
      # avança um PATCH porque a estável que ela mirava já foi corrigida em
      # produção. O dry-run recebe a mesma versão que o merge vai impor.
      - name: Calcular a versão imposta quando a origem é um hotfix
        id: hotfix
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          if ! node -e "process.exit(require('./.github/scripts/hotfix.js').isHotfixBranch(process.env.HEAD_REF) ? 0 : 1)"; then
            echo "release_as=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT=$(git show "origin/${BASE_REF}:.release-please-manifest-rc.json" | jq -r '."."')
          RELEASE_AS=$(node -e "process.stdout.write(require('./.github/scripts/hotfix.js').hotfixReleaseAs('rc', process.argv[1]))" "$CURRENT")

          echo "Retroporte de hotfix: ${CURRENT} -> ${RELEASE_AS}."
          echo "release_as=${RELEASE_AS}" >> "$GITHUB_OUTPUT"

      # O release-please busca commits por branch via GraphQL e não enxerga
      # `refs/pull/N/merge`. Publicar o merge simulado como uma branch efêmera
      # é o que permite rodar o cálculo real sobre o resultado do merge.
      - name: Publicar merge simulado como branch efêmera
        id: ephemeral
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          REF="release-please-preview/pr-${PR_NUMBER}"

          # O GitHub calcula o merge commit de forma assíncrona: no evento
          # `opened` o payload traz `merge_commit_sha: null`. É preciso esperar
          # `mergeable` deixar de ser null para saber se há SHA ou conflito.
          MERGE_SHA=""
          for attempt in $(seq 1 20); do
            PR_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
            MERGEABLE=$(jq -r '.mergeable' <<<"$PR_JSON")
            CANDIDATE=$(jq -r '.merge_commit_sha // empty' <<<"$PR_JSON")

            if [ "$MERGEABLE" = "true" ] && [ -n "$CANDIDATE" ]; then
              MERGE_SHA="$CANDIDATE"
              break
            fi
            if [ "$MERGEABLE" = "false" ]; then
              echo "::warning::O PR tem conflitos com a branch alvo; não há merge simulado para analisar."
              echo "ref=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "  aguardando o GitHub calcular o merge commit (tentativa ${attempt}, mergeable=${MERGEABLE})..."
            sleep 3
          done

          if [ -z "${MERGE_SHA}" ]; then
            echo "::warning::O GitHub não calculou o merge commit a tempo. Dry-run pulado; a projeção abaixo segue válida."
            echo "ref=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${REF}" >/dev/null 2>&1 || true
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/heads/${REF}" -f sha="${MERGE_SHA}" >/dev/null

          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "Branch efêmera ${REF} -> ${MERGE_SHA}"

      - name: release-please (dry-run) sobre o merge simulado
        id: rp
        if: steps.ephemeral.outputs.ref != ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_REF: ${{ steps.ephemeral.outputs.ref }}
          RELEASE_AS: ${{ steps.hotfix.outputs.release_as }}
        run: |
          ARGS=()
          if [ -n "${RELEASE_AS}" ]; then
            ARGS+=(--release-as="${RELEASE_AS}")
          fi

          set +e
          npx --yes release-please@16 release-pr \
            --token="${GITHUB_TOKEN}" \
            --repo-url="${GITHUB_REPOSITORY}" \
            --target-branch="${PREVIEW_REF}" \
            --config-file=release-please-config-rc.json \
            --manifest-file=.release-please-manifest-rc.json \
            "${ARGS[@]}" \
            --dry-run \
            > rp-dryrun.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          echo "--- saída do release-please (dry-run) ---"
          cat rp-dryrun.log

      - name: Remover branch efêmera
        if: always() && steps.ephemeral.outputs.ref != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_REF: ${{ steps.ephemeral.outputs.ref }}
        run: |
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${PREVIEW_REF}" >/dev/null 2>&1 \
            && echo "branch efêmera ${PREVIEW_REF} removida" \
            || echo "branch efêmera ${PREVIEW_REF} já não existia"

      - name: Projetar versão e comentar no PR
        uses: actions/github-script@v7
        env:
          RP_EXIT_CODE: ${{ steps.rp.outputs.exit_code }}
          HOTFIX_RELEASE_AS: ${{ steps.hotfix.outputs.release_as }}
        with:
          script: |
            const fs = require('fs');
            const { execFileSync } = require('child_process');
            const { parseConventional, highestImpact } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/validate-pr.js`);
            const { nextRc, stableCore } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/compute-version.js`);

            const pr = context.payload.pull_request;
            const hotfixReleaseAs = process.env.HOTFIX_RELEASE_AS || null;

            const readManifest = (ref, file) => {
              try {
                const raw = execFileSync('git', ['show', `origin/${ref}:${file}`], { encoding: 'utf8' });
                return JSON.parse(raw)['.'];
              } catch {
                return null;
              }
            };

            // Cada track guarda seu estado na branch onde publica: o RC em
            // `release`, o estável na branch default. Ler o manifesto estável a
            // partir de `release` sempre devolveria 0.0.0, porque os commits de
            // release da branch default nunca chegam à staging.
            const defaultBranch = context.payload.repository.default_branch;
            const lastRc = readManifest(pr.base.ref, '.release-please-manifest-rc.json') || '0.0.0';
            const lastStable = readManifest(defaultBranch, '.release-please-manifest.json') || '0.0.0';

            const rawCommits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const parsed = rawCommits.map((c) => {
              const p = parseConventional(c.commit.message, '');
              p.sha = c.sha;
              return p;
            });

            const relevant = parsed.filter((p) => p.valid);
            const invalid = parsed.filter((p) => !p.valid);
            const impact = highestImpact(relevant);
            const projected = hotfixReleaseAs ?? nextRc(lastStable, lastRc, impact);

            let dryRun = '(dry-run não executado)';
            try {
              dryRun = fs.readFileSync(`${process.env.GITHUB_WORKSPACE}/rp-dryrun.log`, 'utf8').trim() || '(vazio)';
            } catch { /* o step do dry-run pode ter sido pulado */ }

            // O release-please conta todos os commits desde a última release do
            // track — não apenas os deste PR —, então a versão dele é a fonte da
            // verdade. A projeção local só entra se o dry-run não produzir uma.
            const computed = dryRun.match(/^title:.*?\bv(\d+\.\d+\.\d+[^\s]*)\s*$/m)?.[1] ?? null;
            const version = computed ?? projected;
            const origem = hotfixReleaseAs
              ? 'imposta pela política de hotfix (`--release-as`)'
              : computed
                ? 'calculada pelo `release-please`'
                : '⚠️ projeção local — o dry-run não retornou versão';

            const IMPACT_LABEL = {
              major: '`MAJOR` — quebra de compatibilidade',
              minor: '`MINOR` — nova funcionalidade',
              patch: '`PATCH` — correção',
              none: 'nenhum bump (só manutenção)',
            };

            const SECTION = {
              feat: '✨ Funcionalidades',
              fix: '🐛 Correções',
              perf: '⚡ Performance',
              revert: '⏪ Revertidos',
              refactor: '♻️ Refatorações',
              docs: '📚 Documentação',
              build: '📦 Build',
              ci: '🤖 CI/CD',
            };

            const grouped = new Map();
            for (const c of relevant) {
              const section = SECTION[c.type];
              if (!section) continue;
              if (!grouped.has(section)) grouped.set(section, []);
              grouped.get(section).push(c);
            }

            const lines = [
              '<!-- pr-release-preview -->',
              hotfixReleaseAs
                ? '## 🚑 Retroporte de hotfix para staging'
                : '## 🧪 Prévia da Release Candidate',
              '',
              hotfixReleaseAs
                ? 'A correção já foi publicada em produção. A RC atual aponta para uma estável que o ' +
                  'hotfix corrigiu, então o núcleo avança um **PATCH** e o contador de RC reinicia.'
                : 'O `release-please` analisou os commits semânticos que entrarão em `release`.',
              '',
              '| | |',
              '| --- | --- |',
              `| Última RC publicada | \`${lastRc === '0.0.0' ? '—' : 'v' + lastRc}\` |`,
              `| Última estável publicada | \`${lastStable === '0.0.0' ? '—' : 'v' + lastStable}\` |`,
              `| Impacto dos commits | ${IMPACT_LABEL[impact]} |`,
              `| **Versão que será gerada** | **\`v${version}\`** |`,
              `| Origem do cálculo | ${origem} |`,
              `| Estável correspondente | \`v${stableCore(version)}\` (ao promover para \`main\`) |`,
              `| Commits analisados | ${relevant.length} semânticos / ${parsed.length} totais |`,
              '',
            ];

            if (impact === 'none' && !computed && !hotfixReleaseAs) {
              lines.push(
                '> ⚠️ Nenhum commit com impacto de versão (`feat`, `fix`, `perf`, breaking).',
                '> O merge não vai gerar uma nova release candidate.',
                ''
              );
            }

            if (hotfixReleaseAs) {
              lines.push(
                `> ℹ️ O impacto dos commits (${IMPACT_LABEL[impact]}) é informativo aqui: a versão de um`,
                '> retroporte de hotfix é imposta, não calculada. Falta ainda o back-merge para `develop`',
                '> — com título `chore(hotfix): …`, para não gerar um terceiro bump.',
                ''
              );
            }

            if (invalid.length > 0) {
              lines.push(
                `> ⚠️ ${invalid.length} commit(s) sem formato Conventional Commits foram ignorados no cálculo:`,
                ...invalid.map((c) => `> - \`${c.sha.slice(0, 7)}\` ${c.subject}`),
                ''
              );
            }

            if (grouped.size > 0) {
              lines.push('### Changelog previsto', '');
              for (const [section, items] of grouped) {
                lines.push(`#### ${section}`, '');
                for (const c of items) {
                  const scope = c.scope ? `**${c.scope}:** ` : '';
                  const bang = c.breaking ? ' ⚠️ **BREAKING**' : '';
                  lines.push(`- ${scope}${c.description}${bang} (\`${c.sha.slice(0, 7)}\`)`);
                }
                lines.push('');
              }
            }

            lines.push(
              '<details><summary>Saída bruta do <code>release-please --dry-run</code></summary>',
              '',
              '```',
              dryRun.slice(0, 8000) || '(vazio)',
              '```',
              '',
              '</details>',
              '',
              '---',
              '',
              'Ao mergear este PR (**merge commit**, para preservar os commits semânticos), o workflow',
              '`Release Candidate` publica a tag e o pre-release no GitHub.'
            );

            const body = lines.join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const previous = comments.find((c) => c.body?.includes('<!-- pr-release-preview -->'));

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: previous.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: pr.number, body,
              });
            }

            await core.summary.addRaw(body.replace('<!-- pr-release-preview -->', '')).write();
