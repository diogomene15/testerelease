name: Guard · feature → develop

# Porta de entrada do fluxo: nada entra em `develop` sem label de mudança e sem
# Conventional Commits. Como o merge em `develop` é squash, o título do PR vira
# a mensagem de commit — por isso ele também é validado.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]
    branches: [develop]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-develop-guard-${{ github.event.pull_request.number }}
  # Sem cancelamento: este é o status check obrigatório de `develop`, e um run
  # cancelado permanece no rollup do PR como check não-bem-sucedido, bloqueando
  # o merge mesmo depois de um run posterior passar. Dois eventos próximos
  # (`opened` + `labeled`, por exemplo) bastam para cair nisso.
  cancel-in-progress: false

jobs:
  guard:
    name: Conventional Commits + label obrigatória
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Testes do validador
        run: node --test .github/scripts/*.test.js

      - name: Validar PR
        uses: actions/github-script@v7
        with:
          script: |
            const { validate } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/validate-pr.js`);
            const pr = context.payload.pull_request;

            const rawCommits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const result = validate({
              prTitle: pr.title,
              prBody: pr.body || '',
              commits: rawCommits.map((c) => ({ sha: c.sha, message: c.commit.message })),
              labels: pr.labels.map((l) => l.name),
              headRef: pr.head.ref,
              baseRef: pr.base.ref,
            });

            const IMPACT_LABEL = {
              major: '`MAJOR` — quebra compatibilidade',
              minor: '`MINOR` — nova funcionalidade',
              patch: '`PATCH` — correção',
              none: 'nenhum bump de versão',
            };

            const lines = [
              '<!-- pr-develop-guard -->',
              result.ok
                ? '## ✅ PR liberado para `develop`'
                : '## ❌ PR bloqueado para `develop`',
              '',
              '| Item | Valor |',
              '| --- | --- |',
              `| Branch de origem | \`${pr.head.ref}\`${result.hotfixBackmerge ? ' 🚑 (back-merge de hotfix)' : ''} |`,
              `| Label de mudança | ${result.changeLabel ? `\`${result.changeLabel}\`` : '_ausente_'} |`,
              `| Commits analisados | ${result.validCommitCount}/${result.commitCount} válidos |`,
              `| Impacto detectado | ${IMPACT_LABEL[result.actualImpact]}${result.hotfixBackmerge ? ' — só o título conta' : ''} |`,
              `| Método de merge | \`squash\` (obrigatório nesta branch) |`,
              '',
            ];

            if (result.hotfixBackmerge) {
              lines.push(
                'Este PR retroporta um hotfix para `develop`. Ele **não pode gerar versão**: a correção',
                'já foi publicada em `main` (`-hf`) e o ciclo já foi reposicionado em `release` (PATCH).',
                'Como o merge é squash, só o título sobrevive — por isso ele precisa ser de um tipo',
                'neutro (`chore`, `docs`, …) e a label precisa ser `changes: chore`.',
                '',
                'Detalhes em [`docs/HOTFIX.md`](../blob/main/docs/HOTFIX.md).',
                ''
              );
            }

            if (result.errors.length > 0) {
              lines.push('### Pendências obrigatórias', '');
              result.errors.forEach((e, i) => lines.push(`${i + 1}. ${e}`));
              lines.push('');
            }

            if (result.warnings.length > 0) {
              lines.push('### Avisos', '');
              result.warnings.forEach((w) => lines.push(`- ⚠️ ${w}`));
              lines.push('');
            }

            if (result.ok) {
              lines.push(
                'Ao mergear (squash), o commit gerado em `develop` será:',
                '',
                '```',
                pr.title,
                '```',
                '',
                result.hotfixBackmerge
                  ? 'Sendo de tipo neutro, esse commit não move a versão de `release` nem a de `main` — que é o esperado num back-merge de hotfix.'
                  : 'Esse commit é o que o `release-please` vai ler para calcular a versão em `release` e `main`.'
              );
            }

            const body = lines.join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const previous = comments.find((c) => c.body?.includes('<!-- pr-develop-guard -->'));

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }

            await core.summary.addRaw(body.replace('<!-- pr-develop-guard -->', '')).write();

            if (!result.ok) {
              core.setFailed(`PR bloqueado: ${result.errors.length} pendência(s) obrigatória(s).`);
            }
